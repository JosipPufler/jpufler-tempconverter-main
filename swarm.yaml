version: "3.8"

services:

  db:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: tempconverter
      MYSQL_USER: user
      MYSQL_PASSWORD: pass
      MYSQL_ROOT_PASSWORD: rootpassword
    volumes:
      - mysql-data:/var/lib/mysql
    deploy:
      replicas: 1

  tempconverter:
    image: jpufler/tempconverter:dev
    environment:
      DB_HOST: db
      DB_NAME: tempconverter
      DB_USER: user
      DB_PASS: pass
      STUDENT: "Josip Pufler"
      COLLEGE: "Algebra Bernays"

    ports:
      - "80:5000"

    deploy:
      replicas: 2
      placement:
        max_replicas_per_node: 1

volumes:
  mysql-data: