apiVersion: v1
kind: Service
metadata:
  name: mysql
spec:
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
  type: ClusterIP

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mysql
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: mysql:8.0
          ports:
            - containerPort: 3306
          env:
            - name: MYSQL_ROOT_PASSWORD
              value: rootpassword
            - name: MYSQL_DATABASE
              value: tempconverter
            - name: MYSQL_USER
              value: user
            - name: MYSQL_PASSWORD
              value: pass

---
apiVersion: v1
kind: Service
metadata:
  name: tempconverter
spec:
  type: ClusterIP
  selector:
    app: tempconverter
  ports:
    - protocol: TCP
      port: 80
      targetPort: 5000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempconverter
spec:
  replicas: 2
  selector:
    matchLabels:
      app: tempconverter
  template:
    metadata:
      labels:
        app: tempconverter
    spec:
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            - labelSelector:
                matchExpressions:
                  - key: app
                    operator: In
                    values:
                      - tempconverter
              topologyKey: kubernetes.io/hostname

      containers:
        - name: tempconverter
          image: jpufler/tempconverter:dev
          ports:
            - containerPort: 5000
          env:
            - name: DB_HOST
              value: mysql
            - name: DB_PORT
              value: "3306"
            - name: DB_NAME
              value: tempconverter
            - name: DB_USER
              value: user
            - name: DB_PASSWORD
              value: pass
            - name: STUDENT
              value: Josip Pufler
            - name: COLLEGE
              value: Algebra Bernays

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: tempconverter
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: tempconverter
                port:
                  number: 80
